[package]
name = "calzone-server"
description = "CalZone server: storage, sharing, the web app and the doors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
calzone-core.workspace = true
calzone-dav.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["compression-gzip", "trace"] }
# Pinned to 0.8.x: sqlx 0.9 needs rustc >= 1.94. Runtime queries only (no
# compile-time macros), so builds never need a live database.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing = "0.1"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
argon2 = { version = "0.5", features = ["std"] }
askama = "0.16"
serde_urlencoded = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The Baikal importer (decision 30). rustls on ring, not reqwest's default
# aws-lc: that needs cmake in every build image. Certificates come from the
# OS store.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# HTTP Digest auth (Baikal's default).
md-5 = "0.10"
percent-encoding = "2"
# Two-factor sign-in (decision 32): TOTP (HMAC-SHA1, RFC 6238), secrets
# encrypted at rest with AES-256-GCM, the setup QR code as inline SVG.
hmac = "0.12"
sha1 = "0.10"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Google Takeout uploads and the per-user export (deflate, pure Rust).
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
