<!doctype html>
<html lang="{% block lang %}en{% endblock %}" data-theme="{% block theme %}dark{% endblock %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="{% block scheme %}dark{% endblock %}">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"historyCacheSize":0,"refreshOnHistoryMiss":true,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
<title>{% block title %}CalZone{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
{#- On every page, not just the calendar's: boosted navigation swaps the
    body only, so scripts a page puts in its own head would never load. -#}
<link rel="stylesheet" href="/static/event-calendar.min.css">
<script src="/static/event-calendar.min.js" defer></script>
<script src="/static/calendar.js" defer></script>
</head>
<body hx-boost="true">
{% block nav %}{% endblock %}
<main class="page {% block main_class %}{% endblock %}">
<div id="flash" aria-live="polite"></div>
{% block content %}{% endblock %}
</main>
</body>
</html>
