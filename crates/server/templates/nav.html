<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="/">CalZone</a>
    <nav class="sections" aria-label="Sections">
      <a href="/collections" aria-current="{{ nav.on("collections") }}">Calendars &amp; contacts</a>
      <a href="/import" aria-current="{{ nav.on("import") }}">Import &amp; export</a>
      {% if nav.dav %}<a href="/devices" aria-current="{{ nav.on("devices") }}">Devices</a>{% endif %}
      {% if nav.admin %}<a href="/admin/people" aria-current="{{ nav.on("people") }}">People</a>{% endif %}
    </nav>
    <div class="account">
      <a href="/settings" aria-current="{{ nav.on("settings") }}">{{ nav.label }}</a>
      <form method="post" action="/logout"><button type="submit" class="quiet compact">Log out</button></form>
    </div>
  </div>
</header>
