{%- if let Some(p) = photo -%}
<img class="avatar{% if big %} big{% endif %}" src="{{ p }}" alt="" loading="lazy" width="40" height="40">
{%- else -%}
<svg class="avatar{% if big %} big{% endif %}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="{{ color }}"/><text x="20" y="25.5" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700" font-family="system-ui, sans-serif">{{ initials }}</text></svg>
{%- endif -%}
