# DEVELOPMENT + TESTS: source bind-mounted, bacon rebuilds on change.
#   make dev | make test | make lint | make android-core
# Not for deployment; see deploy/docker-compose.yml for that.
services:
  calzone-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: calzone-server-dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://calzone:calzone@db:5432/calzone
      CALZONE_TEST_DATABASE_URL: postgres://calzone:calzone@db:5432/postgres
      CALZONE_BIND: 0.0.0.0:8080
      CALZONE_COOKIE_SECURE: "off"
      CALZONE_DAV: ${CALZONE_DAV:-on}
      # A fixed development key (two-factor secrets at rest); never use it live.
      CALZONE_SECRET_KEY: ZGV2ZWxvcG1lbnQta2V5LW5vdC1mb3ItbGl2ZS11c2U=
      CALZONE_TWO_FACTOR: ${CALZONE_TWO_FACTOR:-optional}
      CALZONE_PUBLIC_URL: ${CALZONE_PUBLIC_URL:-}
      RUST_LOG: ${RUST_LOG:-debug}
    volumes:
      - ..:/app
      - cargo-registry:/usr/local/cargo/registry
      - target:/app/target

  android-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.android-core
    image: calzone-android-core
    profiles: ["android"]
    volumes:
      - ..:/app
      - cargo-registry:/usr/local/cargo/registry
      - android-target:/app/target

  db:
    image: postgres:17
    container_name: calzone-server-dev-db
    environment:
      POSTGRES_USER: calzone
      POSTGRES_PASSWORD: calzone
      POSTGRES_DB: calzone
    volumes:
      - db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calzone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cargo-registry:
  target:
  android-target:
  db-dev:
