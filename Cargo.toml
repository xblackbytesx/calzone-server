[workspace]
resolver = "3"
# core: the domain model, iCalendar/vCard content lines, recurrence, the
# per-user split, sync types. Pure, no IO: the server and (through ffi) the
# Android app run the same code, so they always agree.
# dav: the optional CalDAV/CardDAV door. Talks to the domain service only.
# server: storage, sharing, auth, the web app, the doors; the binary.
# client: the phone's store and sync engine (SQLite); talks to the server
# only through the sync API.
# ffi: UniFFI bindings over client and core for the Android app.
members = ["crates/core", "crates/dav", "crates/server", "crates/client", "crates/ffi"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"

[workspace.dependencies]
calzone-core = { path = "crates/core" }
calzone-dav = { path = "crates/dav" }
calzone-client = { path = "crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
